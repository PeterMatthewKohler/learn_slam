vio_node:
  ros__parameters:
    imu_sub_topic_name: "/chassis/imu"
    left_img_sub_topic_name: "/front_stereo_camera/left/image_raw"
    left_camera_info_sub_topic_name: "/front_stereo_camera/left/camera_info"
    right_img_sub_topic_name: "/front_stereo_camera/right/image_raw"
    right_camera_info_sub_topic_name: "/front_stereo_camera/right/camera_info"
    vio_pub_topic_name: "/vio/odom"
    publish_debug_stereo_features: true
    publish_estimator_debug: true
    world_frame_id: "vio_odom"
    body_frame_id: "base_link"
    imu_frame_id: "chassis_imu"
    left_camera_frame_id: "front_stereo_camera_left_rgb"
    right_camera_frame_id: "front_stereo_camera_right_rgb"
    publish_tf: false
    camera_imu_time_offset_sec: 0.0
    stereo_processing_interval_s: 0.08
    imu_msg_gap_threshold_s: 0.05
    imu_msg_buffer_window_s: 10.0
    imu_initialization_window_s: 2.0
    imu_initialization_min_samples: 100
    imu_stationary_max_gyro_mean_norm_rad_s: 0.005
    imu_stationary_max_gyro_stddev_rad_s: 0.001
    imu_stationary_max_accel_stddev_m_s2: 0.01
    imu_stationary_gravity_magnitude_m_s2: 9.8
    imu_stationary_gravity_tolerance_m_s2: 0.1
    initial_position_stddev_m: 0.01
    initial_orientation_stddev_rad: 0.01
    initial_velocity_stddev_m_s: 0.05
    initial_gyroscope_bias_stddev_rad_s: 0.001
    initial_accelerometer_bias_stddev_m_s2: 0.1
    imu_gyroscope_noise_density_rad_s_sqrt_hz: 1.0e-4
    imu_accelerometer_noise_density_m_s2_sqrt_hz: 1.0e-3
    imu_gyroscope_bias_random_walk_rad_s2_sqrt_hz: 1.0e-6
    imu_accelerometer_bias_random_walk_m_s3_sqrt_hz: 1.0e-5
    visual_measurement_queue_max_size: 20
    visual_position_stddev_m: 0.05
    visual_orientation_stddev_rad: 0.035
    visual_innovation_gate_chi2: 50.0
